name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip

      # With the web extra: the web back end's tests (most of the page's logic) run here too,
      # instead of skipping for lack of FastAPI.
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test,web]"

      - name: Check bootstrap shell syntax
        run: bash -n poc/kaggle_worker/bootstrap.sh

      # requirements.lock must still be what pyproject.toml resolves to (the same uv as `make lock`).
      - name: Lock file is current
        run: |
          python -m pip install "uv==0.11.32"
          cp requirements.lock "$RUNNER_TEMP/requirements.lock"
          make lock LOCK="$RUNNER_TEMP/requirements.lock"
          diff -u requirements.lock "$RUNNER_TEMP/requirements.lock"

      - name: Run test suite
        run: python -m pytest tests/poc/kaggle_worker -q -p no:cacheprovider

  # The web page type-checks and builds (Node.js from the same wheel as the ui extra and the image).
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Node.js
        run: python -m pip install "nodejs-wheel>=24,<25"
      - name: Type-check and build
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

  # The deployment files: Compose config, shell scripts, Terraform.
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Compose file
        run: |
          printf 'KITE_IMAGE=kite:test\n' > /tmp/images.env
          printf '%s\n' KITE_DOMAIN=example.invalid TEMPORAL_POSTGRES_PASSWORD=x KITE_WEB_DB_PASSWORD=y \
            TEMPORAL_VISIBILITY_POSTGRES_PASSWORD=z TEMPORAL_SETUP_POSTGRES_PASSWORD=w \
            DOCKER_GID=999 KITE_ACCESS=public > /tmp/stack.env
          docker compose -p kite --project-directory deploy/stack --env-file /tmp/stack.env \
            --env-file /tmp/images.env -f deploy/stack/compose.yaml config --quiet
      - name: Shell scripts
        run: |
          shellcheck -x deploy/stack/install.sh deploy/stack/temporal-setup.sh deploy/stack/web-db.sh \
            deploy/sandbox/context.sh infra/aws/*.sh
          python3 -m py_compile deploy/stack/kite_stack.py

  # Terraform of the AWS machine (infra/aws): checked here, applied by the infra workflow by hand.
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
      - name: Format and validation
        run: |
          terraform fmt -check -recursive infra
          for dir in infra/aws infra/aws/bootstrap; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

  # Images for the Compose deployment, only from main once every check above passed: sha-<commit>, and
  # `stable`, the tag kite-stack on the machines follows.
  images:
    needs: [tests, web, deploy, terraform]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing of the pushed images (OIDC, this job only)
    env:
      KITE_IMAGE: ghcr.io/${{ github.repository_owner }}/kite
      SANDBOX_IMAGE: ghcr.io/${{ github.repository_owner }}/kite-sandbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Commit
        id: commit
        run: |
          echo "short=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Kite image
        id: kite_image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: ${{ env.KITE_IMAGE }}:sha-${{ steps.commit.outputs.short }}
          build-args: |
            KITE_VERSION=${{ github.sha }}
            KITE_VERSION_DATE=${{ steps.commit.outputs.date }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.created=${{ steps.commit.outputs.date }}
          cache-from: type=gha,scope=kite
          cache-to: type=gha,scope=kite,mode=max
      - name: Sandbox build context
        run: bash deploy/sandbox/context.sh "${{ runner.temp }}/sandbox"
      - name: Sandbox image
        id: sandbox_image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ runner.temp }}/sandbox
          push: true
          tags: ${{ env.SANDBOX_IMAGE }}:sha-${{ steps.commit.outputs.short }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=sandbox
          cache-to: type=gha,scope=sandbox,mode=max
      # Keyless signing (Sigstore, GitHub OIDC identity of this workflow): machines verify these
      # signatures before adopting an update, so a re-tagged or foreign image is refused.
      # The release machines verify with: deploy/stack/install.sh installs the same one (a test keeps
      # the two equal).
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: v2.5.2
      - name: Sign images
        run: |
          cosign sign --yes "${{ env.KITE_IMAGE }}@${{ steps.kite_image.outputs.digest }}"
          cosign sign --yes "${{ env.SANDBOX_IMAGE }}@${{ steps.sandbox_image.outputs.digest }}"
      # The machines update from the stable tag: it moves only once both images are signed, so it
      # never points at an unsigned image. The tag must keep the signed digest, or every machine
      # would refuse the update: checked, not assumed.
      - name: Tag stable
        env:
          KITE_DIGEST: ${{ steps.kite_image.outputs.digest }}
          SANDBOX_DIGEST: ${{ steps.sandbox_image.outputs.digest }}
        run: |
          for pair in "$KITE_IMAGE $KITE_DIGEST" "$SANDBOX_IMAGE $SANDBOX_DIGEST"; do
            read -r image digest <<< "$pair"
            docker buildx imagetools create -t "$image:stable" "$image@$digest"
            tagged=$(docker buildx imagetools inspect "$image:stable" --format '{{.Manifest.Digest}}')
            if [ "$tagged" != "$digest" ]; then
              echo "$image:stable is $tagged, not the signed $digest" >&2
              exit 1
            fi
          done

  # A pull request builds both images too (nothing is pushed or signed) and starts the Kite image once,
  # so a Dockerfile or dependency change is caught before it reaches main and the stable tag.
  images-check:
    needs: [tests, web, deploy, terraform]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Kite image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          load: true
          tags: kite:check
          cache-from: type=gha,scope=kite
      - name: Kite image starts
        run: |
          docker run --rm -e HOME=/tmp kite:check kite --help >/dev/null
          docker run --rm -e HOME=/tmp kite:check opencode --version
          docker run --rm -e HOME=/tmp kite:check python -c \
            "import fastapi, markitdown, skillshield, docling, torch; print('torch', torch.__version__)"
      - name: Sandbox build context
        run: bash deploy/sandbox/context.sh "${{ runner.temp }}/sandbox"
      - name: Sandbox image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ runner.temp }}/sandbox
          push: false
          cache-from: type=gha,scope=sandbox
