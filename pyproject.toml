[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "kite-coding-agent"
version = "0.1.0"
description = "Kite control plane for durable, provider-neutral coding tasks"
requires-python = ">=3.12,<3.14"
dependencies = [
    "temporalio==1.36.0",
    "PyYAML==6.0.2",
    "aiohttp>=3.10,<4",
    "mcp>=1.9,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3,<10",
    "PyYAML>=6.0,<7",
]
# The code map (codemap.py): graphify's local tree-sitter graph of the task's repository.
codemap = [
    "graphifyy==0.9.113",
]
# Autostart (launcher.py): the Kaggle CLI pushes and checks the worker notebook. kaggle 2.2.5 imports
# six without declaring it.
kaggle = [
    "kaggle==2.2.5",
    "six>=1.16",
]
# Kite's own browser for kaggle.com (browser.py): Playwright drives Chromium (installed separately with
# `playwright install --with-deps chromium`); the saved Kaggle session is encrypted (AES-GCM).
browser = [
    "playwright>=1.49,<2",
    "cryptography>=42",
]
# Kite's web back end (web/): FastAPI on uvicorn, SQLAlchemy (SQLite, or Postgres through psycopg), argon2
# passwords; cryptography seals the 2FA key.
web = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0,<3",
    "argon2-cffi>=23",
    "psycopg[binary]>=3.2",
    "cryptography>=42",
    "httpx>=0.27",
    # Gói 5 (Connect): skill scanner — skillshield 1.3.0, chosen by evaluation
    # (4/4 on the research samples, offline, JSON + exit code). Zero runtime
    # deps. Argus runs via npx (preinstalled in the image), MCPiranha in its
    # own venv — neither goes in pyproject (mcp>=2.3 conflicts with Kite's mcp<2).
    "skillshield==1.3.0",
    "markitdown[pdf,docx,pptx]==0.1.9",
]
# Docling fallback for the Knowledge store (web/docling_job.py): OCR + table/column
# structure for scanned PDFs. Installed only when reconvert is needed; the
# Docker image installs it via the "docling" extra (see Dockerfile).
docling = [
    "docling==2.152.0",
]
# Node.js for building the web page (web/ → web/dist, `kite web build`): node and npm inside Kite's venv,
# so no system package is needed. Docker images build the page in their own Node stage instead.
ui = [
    "nodejs-wheel>=24,<25",
]

[project.scripts]
kite = "poc.kaggle_worker.cli:console_main"
kite-worker = "poc.kaggle_worker.cli:console_main"

[tool.setuptools.packages.find]
include = ["poc*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # FastAPI's TestClient (tests only) warns that starlette prefers httpx2; the web itself does not use it.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]