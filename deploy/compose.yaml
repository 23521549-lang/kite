services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_POSTGRES_PASSWORD:?set in deploy/.env}
      POSTGRES_DB: postgres
    volumes:
      - ${KITE_DATA_DIR:-/var/lib/kite}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - control

  admin-tools:
    image: temporalio/admin-tools:1.32.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_POSTGRES_PASSWORD:?set in deploy/.env}
      POSTGRES_SEEDS: postgres
      SQL_PASSWORD: ${TEMPORAL_POSTGRES_PASSWORD:?set in deploy/.env}
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/sh"]
    command: ["/scripts/setup-postgres.sh"]
    restart: "no"
    networks:
      - control

  temporal:
    image: temporalio/server:1.32.2
    depends_on:
      admin-tools:
        condition: service_completed_successfully
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_POSTGRES_PASSWORD:?set in deploy/.env}
      POSTGRES_SEEDS: postgres
      SQL_PASSWORD: ${TEMPORAL_POSTGRES_PASSWORD:?set in deploy/.env}
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    ports:
      - "127.0.0.1:7233:7233"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    networks:
      - control

  ui:
    profiles: ["operator-ui"]
    image: temporalio/ui:2.56.1
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    networks:
      - control

networks:
  control:
    driver: bridge
